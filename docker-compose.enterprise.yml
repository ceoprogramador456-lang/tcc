# Variante "enterprise": API atrás de um reverse proxy (Caddy, com TLS
# automático) e MySQL persistente, pensada para uma primeira implantação em
# produção/homologação. Uso:
#   docker compose -f docker-compose.enterprise.yml up -d --build
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: siva_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
    volumes:
      - siva_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=tcp -h 127.0.0.1 -uroot -e "SELECT 1"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/siva_db
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MOCK_MODE: 'false'
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/siva_db
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      TRUST_PROXY_HOPS: '1'
      PAIRING_COMPANY_ID: ${PAIRING_COMPANY_ID:?defina a empresa desta instalação}
      PAIRING_KEY: ${PAIRING_KEY:?defina uma chave de pareamento persistente}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    environment:
      SIVA_API_DOMAIN: ${SIVA_API_DOMAIN:?defina o domínio HTTPS da API}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - siva_caddy_data:/data
      - siva_caddy_config:/config
    depends_on:
      - api

volumes:
  siva_mysql_data:
  siva_caddy_data:
  siva_caddy_config:
